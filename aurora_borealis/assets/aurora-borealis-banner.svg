      <stop offset="0%" stop-color="#1b1d23" />
      <stop offset="100%" stop-color="#111216" />
    </linearGradient>

    
    <linearGradient id="auroraGrad" x1="8%" y1="70%" x2="92%" y2="25%">
      <stop offset="0%" stop-color="#00c882" />
      <stop offset="32%" stop-color="#18cfb8" />
      <stop offset="65%" stop-color="#35aae8" />
