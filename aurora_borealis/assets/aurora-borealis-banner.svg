      <stop offset="35%" stop-color="#14968c" />
      <stop offset="65%" stop-color="#297ec4" />
      <stop offset="100%" stop-color="#695eb8" />
    </linearGradient>

    
    <linearGradient id="curtainFade" x1="0%" y1="0%" x2="0%" y2="100%">
