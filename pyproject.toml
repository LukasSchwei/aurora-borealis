[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aurora-borealis"
version = "0.2.0"
description = "Cross-platform (Linux & Windows) D&D 5e / 5.5e Character Builder"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5",
    "lxml>=4.9",
    "pypdf>=4.0",
]

[project.scripts]
aurora-borealis-cli = "aurora_borealis.main:main"

[project.gui-scripts]
aurora-borealis = "aurora_borealis.main:main"

[tool.setuptools.packages.find]
include = ["aurora_borealis*"]

[tool.setuptools.package-data]
aurora_borealis = ["assets/*", "assets/templates/*"]
